name: Android

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "Using repository signing key from secrets."
          else
            keytool -genkeypair -keystore app/release.keystore \
              -alias assignme -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass assignme123 -keypass assignme123 \
              -dname "CN=AssignMe, OU=AssignMe, O=AssignMe, C=NG"
            echo "No signing secrets set — used an ephemeral key for this build."
            echo "Add ANDROID_KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD"
            echo "as repository secrets for stable, upgradeable releases (see docs/08-android.md)."
          fi

      - name: Build release APK and AAB
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then export KEYSTORE_PASSWORD=assignme123; fi
          if [ -z "$KEY_ALIAS" ]; then export KEY_ALIAS=assignme; fi
          if [ -z "$KEY_PASSWORD" ]; then export KEY_PASSWORD=assignme123; fi
          gradle assembleRelease bundleRelease --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v1.0.${{ github.run_number }}"
          gh release create "$TAG" \
            --title "AssignMe Android v1.0.${{ github.run_number }}" \
            --notes "Release APK + AAB built from main. Package com.assignme.app." \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab
